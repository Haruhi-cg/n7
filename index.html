<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChatSchedule">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ChatSchedule</title>
<style>
:root{ 
  --bg:#0e0f11;--panel:#18191c;--ink:#f2f1ee;--sub:#9a9ea6;--line:#2c2e33;
  --accent:#f2f1ee;--accent-soft:#25272b;--on-accent:#0e0f11;--blue:#7fa8d6;--blue-soft:#1f2a37;
  --purple:#b09ad6;--purple-soft:#2a2336;--gray-soft:#232529;--warn:#f08a80;
  --me:#f2f1ee;--me-ink:#0e0f11;
}
:root[data-theme="light"]{ 
  --bg:#f6f5f2;--panel:#ffffff;--ink:#1d1f23;--sub:#6b6f76;--line:#e3e1dc;
  --accent:#2b2d33;--accent-soft:#ecebe7;--on-accent:#fff;--blue:#3a6ea5;--blue-soft:#dde8f4;
  --purple:#7a5aa8;--purple-soft:#ebe3f5;--gray-soft:#ecebe7;--warn:#b3261e;
  --me:#1d1f23;--me-ink:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:baseline;justify-content:space-between}
header h1{font-size:17px;margin:0;font-weight:700}
header .now{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
main{flex:1;overflow:hidden;position:relative}
section.view{position:absolute;inset:0;overflow-y:auto;padding:0 16px 16px;display:none}
section.view.on{display:block}
#chatView.on{display:flex;flex-direction:column;padding:0}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:max(0px,calc(env(safe-area-inset-bottom) - 20px))}
nav button{flex:1;border:0;background:none;padding:10px 0 10px;font-size:13px;color:var(--sub);font-family:inherit}
nav button.on{color:var(--ink);font-weight:700}


#log{flex:1;overflow-y:auto;padding:8px 16px 12px}
.msg{max-width:85%;margin:6px 0;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.me{margin-left:auto;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.msg.app{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .t{display:block;font-size:11px;opacity:.55;margin-top:2px}
.msg button.undo{margin-top:6px;font-size:12px;border:1px solid var(--line);background:none;color:var(--sub);border-radius:8px;padding:3px 8px;font-family:inherit}
.composer{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;font-family:inherit;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.hist{color:var(--sub)}
.chip.task{border-color:var(--c,var(--line));color:var(--ink)}
.chip .dot,h2 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.chip.on.cat{background:var(--c);border-color:var(--c);color:#fff}
.chip.on.cat .dot{background:#fff}
.chip.quick{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.row{display:flex;gap:8px}
#inp{flex:1;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
#send{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:0 16px;font-size:15px;font-weight:700;font-family:inherit}


.legend{font-size:12px;color:var(--sub);padding:10px 0 4px;line-height:1.6}
.calbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.calnav{display:flex;align-items:center;gap:4px;min-width:0}
.calnav .ct{font-weight:700;font-size:15px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.nb{border:0;background:none;color:var(--ink);font-size:22px;line-height:1;padding:2px 8px;font-family:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--panel);color:var(--sub);padding:6px 12px;font-size:13px;font-family:inherit}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.sun{color:#c0392b}.sat{color:var(--blue)}

.mgrid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}
.mgrid.head{border:0}.mgrid.head div{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
.mc{min-height:76px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px;overflow:hidden;background:var(--panel);cursor:pointer}
.mc.out{opacity:.4}
.md{display:inline-block;font-size:12px;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;margin-bottom:1px}
.mc.today .md{background:var(--accent);color:var(--on-accent)}
.mi{font-size:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:clip;border-radius:3px;padding:0 2px;margin-top:1px}
.mi.ev{background:var(--c);color:#fff}
.mi.dl{color:var(--c);font-weight:600}
.notice{border:1.5px solid var(--warn);border-radius:10px;padding:8px 10px;margin:8px 0 12px;font-size:14px}
.notice .nrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);margin-top:6px}
.notice .sm{font-size:12px;color:var(--sub)}
.notice .nacts{display:flex;gap:6px;flex-shrink:0}
.notice button{font-size:12px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:3px 8px;font-family:inherit}
.mi.rec{box-shadow:inset 0 0 0 1px var(--c);color:var(--ink)}
.mi.more{color:var(--sub)}

.wk{margin:0 -8px}
.wkhead{display:grid;grid-template-columns:22px repeat(7,1fr);position:sticky;top:46px;z-index:4;background:var(--bg);border-bottom:1px solid var(--line)}
.wh{text-align:center;padding:2px 0 4px;cursor:pointer;font-size:11px;color:var(--sub)}
.wh b{display:block;font-size:15px;color:var(--ink)}
.wh.today b{color:var(--on-accent);background:var(--accent);border-radius:50%;width:24px;height:24px;line-height:24px;margin:0 auto}
.wh i{display:block;font-style:normal;font-size:9px;color:var(--sub)}
.wkbody{display:grid;grid-template-columns:22px repeat(7,1fr);position:relative}
.tcol{position:relative}
.hl{position:absolute;right:3px;font-size:9px;color:var(--sub);transform:translateY(-5px)}
.wcol{position:relative;border-left:1px solid var(--line)}
.wcol.today{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.6}
.wb{position:absolute;left:1px;right:1px;border-radius:3px;overflow:hidden;font-size:9px;line-height:1.2;padding:1px 2px;cursor:pointer}
.wb span{display:block;word-break:break-all}
.wb.b-event{background:var(--c);color:#fff}
.wb.b-task{background:color-mix(in srgb,var(--c) 22%,var(--panel));border-left:3px solid var(--c);color:var(--ink)}
.wb.b-routine{background:var(--gray-soft);color:var(--sub)}
.wb.b-rec{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--c);color:var(--ink)}
.wb.b-travel{background:repeating-linear-gradient(45deg,var(--gray-soft) 0 4px,transparent 4px 8px);color:var(--sub)}
.wb.past{opacity:.45}
.wb.lateb{outline:2px solid var(--warn)}
.nowline{position:absolute;left:-1px;right:0;height:2px;background:var(--warn);z-index:3}
.nowline::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}

.duebox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:4px 0 8px}
.dueit .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dueit{font-size:14px;padding:3px 0;cursor:pointer}.dueit.done{opacity:.5;text-decoration:line-through}
.blk.past{opacity:.55}
.blk[data-open]{cursor:pointer}
.blk{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;margin:4px 0;font-size:14px}
.blk .tm{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px;padding-top:1px}
.blk .ti{font-weight:600}
.blk .sm{font-size:12px;color:var(--sub);font-weight:400}
.b-routine{background:var(--gray-soft)}
.blk.b-event{background:var(--c);color:#fff}.blk.b-event .tm,.blk.b-event .sm{color:rgba(255,255,255,.85)}
.b-travel{background:repeating-linear-gradient(45deg,var(--gray-soft) 0 6px,transparent 6px 12px);color:var(--sub)}
.blk.b-task{background:color-mix(in srgb,var(--c) 16%,var(--panel));border-left:4px solid var(--c)}
.blk.b-rec{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--c)}
.recbox{margin:4px 0 8px}.recbox .sm{font-size:12px;color:var(--sub)}
.b-break{padding:2px 10px;font-size:12px;color:var(--sub)}
.b-free{border:1px dashed var(--line);color:var(--sub)}
.b-now{box-shadow:inset 0 0 0 2px var(--ink)}
.late{color:var(--warn)!important;font-weight:700}
.empty{color:var(--sub);font-size:14px;padding:20px 0;text-align:center}


h2{font-size:14px;color:var(--sub);margin:16px 0 6px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .nm{font-weight:600;font-size:15px}
.card[style*="--c"]{border-left:4px solid var(--c)}
.card .meta{font-size:12px;color:var(--sub);margin-top:3px}
.bar{height:6px;background:var(--gray-soft);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--ink))}
.card .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.card .acts button,.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:13px;font-family:inherit;white-space:nowrap}
.btn.primary,.card .acts .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.inlineEdit{margin:4px 0 10px auto;max-width:92%;border-color:var(--ink)}
.msg.me .undo{border-color:rgba(127,127,127,.5);color:inherit;opacity:.85}
.msg .mbtns{display:flex;gap:6px;flex-wrap:wrap}
.edit label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
.edit label.ck{display:flex;gap:6px;align-items:center;font-size:13px}
.edit input[type=text],.edit input[type=date],.edit input[type=time],.edit input[type=number],.edit select{width:100%;font-size:16px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit}
.edit .row>*{flex:1;min-width:0}
.edit .row>span{flex:none}
.edit textarea{width:100%;font-size:16px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;resize:vertical}
.hmrow{display:flex;gap:6px;align-items:center}.hmrow input{width:80px!important;flex:none}.hmrow span{font-size:14px}
.evbox{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.memo{font-size:12px;color:var(--sub);margin-top:6px;white-space:pre-wrap;border-left:2px solid var(--line);padding-left:8px}
.log{font-size:12px;color:var(--sub);margin-top:6px;border-top:1px solid var(--line);padding-top:6px;display:none}
.card.open .log{display:block}
.card.sub{margin:4px 0 4px 18px;padding:7px 10px;border-radius:10px}
.card.sub .nm{font-size:14px}
.card.sub.isdone .nm{text-decoration:line-through;opacity:.6}
.pr{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;border:1px solid var(--line);color:var(--sub)}
.pr.high{border-color:var(--warn);color:var(--warn)}
.prog{font-size:12px;color:var(--sub);margin-top:3px}
.dlmark{position:absolute;left:0;right:0;border-top:2px solid var(--c);z-index:3;cursor:pointer}
.dlmark span{position:absolute;right:1px;top:-12px;font-size:9px;line-height:11px;background:var(--bg);color:var(--c);padding:0 2px;border-radius:3px;max-width:100%;overflow:hidden;white-space:nowrap}
.blk.b-dl{grid-template-columns:96px 1fr;padding:4px 10px;border-top:2px solid var(--c);border-radius:0;color:var(--ink)}
.subadd{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.mv{display:flex;gap:4px;width:64px;flex:none}.mv button{width:28px;height:28px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font-size:11px;padding:0}.mv button:disabled{opacity:.3}.mv .sm{font-size:11px;color:var(--sub)}


.set{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.set input[type=text],.set input[type=time],.set input[type=number]{font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit}
.set label{font-size:13px;color:var(--sub)}
.days{display:flex;gap:4px;margin:6px 0}
.days button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--sub);font-family:inherit;font-size:12px}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.crow{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.crow .cn{width:72px;font-size:14px;display:flex;align-items:center}
.crow .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex:none}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--panel)}
.seg2{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;width:max-content}
.seg2 button{border:0;background:var(--panel);color:var(--sub);padding:7px 18px;font-size:14px;font-family:inherit}
.seg2 button.on{background:var(--ink);color:var(--bg);font-weight:700}
.shiftbox textarea{width:100%;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;margin-top:8px}
.shiftbox select,.shiftbox input[type=month]{font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit}
.shiftbox .row label{align-self:center;font-size:13px;color:var(--sub)}
.shrow{display:flex;gap:6px;align-items:center;font-size:14px;padding:4px 0;color:var(--ink)!important}
.help{font-size:13px;line-height:1.7;color:var(--sub)}
.help code{background:var(--gray-soft);padding:1px 5px;border-radius:4px;color:var(--ink)}
</style>
</head>
<body>
<header><h1>ChatSchedule</h1><span class="now" id="clock"></span></header>
<main>
  <section class="view on" id="chatView">
    <div id="log"></div>
    <div class="composer">
      <div class="chips" id="cats"></div>
      <div class="chips" id="sugs"></div>
      <div class="row">
        <input id="inp" placeholder="例：金曜17時までにレポート 2時間" autocomplete="off" enterkeyhint="send">
        <button id="send">送信</button>
      </div>
    </div>
  </section>
  <section class="view" id="dayView"></section>
  <section class="view" id="taskView"></section>
  <section class="view" id="setView"></section>
</main>
<nav>
  <button data-v="chatView" class="on">チャット</button>
  <button data-v="dayView">カレンダー</button>
  <button data-v="taskView">リスト</button>
  <button data-v="setView">設定</button>
</nav>

<script>

const KEY='taskchat.v1';
const WD=['日','月','火','水','木','金','土'];
function defaults(){
  return {
    tasks:[],events:[],chat:[],history:[],
    cats:['学校','バイト','制作','就活','手続き','家事','生活'],
    routines:[
      {id:uid(),title:'睡眠',days:[0,1,2,3,4,5,6],start:'23:30',end:'07:00'},
      {id:uid(),title:'朝ごはん・身支度',days:[0,1,2,3,4,5,6],start:'07:00',end:'07:45'},
      {id:uid(),title:'昼ごはん',days:[0,1,2,3,4,5,6],start:'12:00',end:'12:45'},
      {id:uid(),title:'夜ごはん',days:[0,1,2,3,4,5,6],start:'19:00',end:'19:45'},
      {id:uid(),title:'風呂',days:[0,1,2,3,4,5,6],start:'22:00',end:'22:30'}
    ],
    places:[{name:'大学',travel:0},{name:'バイト',travel:0}],
    settings:{maxBlock:60,brk:5,defEst:30,theme:'dark'}
  };
}
const HUES=[
  {h:250,n:'青'},{h:280,n:'藍'},{h:305,n:'紫'},{h:330,n:'赤紫'},{h:355,n:'ピンク'},
  {h:20,n:'赤'},{h:125,n:'黄緑'},{h:150,n:'緑'},{h:170,n:'エメラルド'},{h:200,n:'青緑'},{h:null,n:'グレー'}
];
const hueColor=h=>h==null?'oklch(0.6 0 0)':'oklch(0.6 0.12 '+h+')';
const DEFAULT_HUE={'学校':250,'バイト':150,'制作':305,'就活':200,'手続き':355,'家事':125,'生活':280,'未分類':null};
function catHue(name){
  name=name||'未分類';
  if(!S.catHue){S.catHue={};S.catHueV2=true;}
  if(!(name in S.catHue)){
    const used=new Set(Object.values(S.catHue));
    const free=HUES.find(x=>x.h!=null&&!used.has(x.h));
    S.catHue[name]=name in DEFAULT_HUE?DEFAULT_HUE[name]:(free?free.h:HUES[Object.keys(S.catHue).length%10].h);
  }
  return S.catHue[name];
}
function catColor(name){return hueColor(catHue(name));}
const cv=name=>' style="--c:'+catColor(name)+'"';
function uid(){return Math.random().toString(36).slice(2,9)}
let S;
function load(){
  try{const r=localStorage.getItem(KEY);S=r?Object.assign(defaults(),JSON.parse(r)):defaults();}
  catch(e){S=defaults();}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(typeof syncSoon==='function')syncSoon();}


const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const toMin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m;};
const ceil5=m=>Math.ceil(m/5)*5;
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function fmtDT(iso){
  if(!iso)return '期限なし';
  const d=new Date(iso);
  return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+') '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function fmtDur(m){m=Math.round(m);if(m<60)return m+'分';const h=Math.floor(m/60),r=m%60;return h+'時間'+(r?r+'分':'');}


const T_PART='(\\d{1,2})(?::(\\d{2})|時(?!間)(?:(\\d{1,2})分|(半))?)';
function partMin(h,mm,m2,half,ampm){
  let H=+h,M=mm?+mm:(m2?+m2:(half?30:0));
  if(ampm==='午後'&&H<12)H+=12;
  return H*60+M;
}
function parse(raw,now){
  let w=' '+raw.replace(/　/g,' ')+' ';
  const take=re=>{const m=w.match(re);if(m)w=w.replace(m[0],' ');return m;};
  const r={};
  let m=take(/[#＃](高|中|低)(?=\s|$)/); if(m)r.prio={'高':'high','中':'mid','低':'low'}[m[1]];
  m=take(/[#＃](\S+)/); if(m)r.cat=m[1];
  m=take(/@(\S+)/); if(m)r.place=m[1];
  m=take(new RegExp('(午前|午後)?'+T_PART+'\\s*(?:-|〜|~|～|から)\\s*(午前|午後)?'+T_PART));
  if(m){r.tStart=partMin(m[2],m[3],m[4],m[5],m[1]);r.tEnd=partMin(m[7],m[8],m[9],m[10],m[6]||m[1]);}
  else{
    m=take(new RegExp('(午前|午後)?'+T_PART));
    if(m)r.t=partMin(m[2],m[3],m[4],m[5],m[1]);
  }
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(m=take(/(\d{1,2})\s*[\/月]\s*(\d{1,2})日?/)){
    let d=new Date(now.getFullYear(),+m[1]-1,+m[2]);
    if(d<addDays(today,-60))d.setFullYear(d.getFullYear()+1);
    r.date=d;
  }else if(take(/一昨日|おととい/))r.date=addDays(today,-2);
  else if(take(/昨日|きのう/))r.date=addDays(today,-1);
  else if(take(/明後日|あさって/))r.date=addDays(today,2);
  else if(take(/明日|あした|あす/))r.date=addDays(today,1);
  else if(take(/今日|きょう|今夜|今晩/))r.date=today;
  else if(m=take(/(来週の?|今週の?)?\s*(月|火|水|木|金|土|日)曜日?/)){
    const t=WD.indexOf(m[2]);let diff;
    if(m[1]&&m[1].startsWith('来週')){
      const toNextMon=(8-today.getDay())%7||7;
      diff=toNextMon+(t+6)%7;
    }else diff=(t-today.getDay()+7)%7;
    r.date=addDays(today,diff);
  }
  if(m=take(/(\d+(?:\.\d+)?)\s*(分|時間)\s*(やった|進めた|作業した|した|できた)/))r.spent=+m[1]*(m[2]==='時間'?60:1);
  else if(m=take(/あと\s*(\d+(?:\.\d+)?)\s*(分|時間)/))r.left=+m[1]*(m[2]==='時間'?60:1);
  else if(m=take(/(\d{1,3})\s*[%％]/))r.pct=Math.min(100,+m[1]);
  else if(take(/半分/))r.pct=50;
  else if(take(/(終わった|おわった|終わり|完了|できた|済み?|done)/i))r.pct=100;
  if(take(/期限なし/))r.noDl=true;
  if(take(/から|にやる|予定に入れる|予定/))r.asEv=true;
  if(take(/(削除|やめた|中止|取り消す)/))r.cancel=true;
  if(m=take(/(\d+(?:\.\d+)?)\s*(?:時間|h)\s*(?:(\d+)\s*分)?/i))r.dur=Math.round(+m[1]*60+(m[2]?+m[2]:0));
  else if(m=take(/(\d+)\s*分/))r.dur=+m[1];
  if(take(/までに|まで|締め?切り?|〆切/))r.until=true;
  r.title=w.replace(/[、。,]/g,' ').replace(/^\s*(に|を|は|の|で)\s+/,' ')
    .replace(/\s+(に|を|は|の|で|する|やる)\s*$/,' ')
    .replace(/^\s*(に|を)/,'').replace(/\s+/g,' ').trim()
    .replace(/^(に|を)/,'').replace(/(を|に|する|やる)$/,'').trim();
  return r;
}


function fmtDay(k){const d=fromKey(k);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';}
function taskIcon(t){return '📌';}
function taskKindName(t){return 'タスク';}
function fmtDL(t){if(!t.deadline)return '';const d=new Date(t.deadline);return t.dlNoTime?fmtDay(dkey(d)):fmtDT(t.deadline);}
const PRIO={high:0,mid:1,low:2},PRIO_JA={high:'高',mid:'中',low:'低'};
function parentOf(t){return t&&t.parentId?S.tasks.find(x=>x.id===t.parentId)||null:null;}
function childrenOf(t){return S.tasks.filter(x=>x.parentId===t.id).sort((a,b)=>String(a.created).localeCompare(String(b.created)));}
function hasKids(t){return S.tasks.some(x=>x.parentId===t.id);}
function effPrio(t){const p=parentOf(t);return t.prio||(p&&p.prio)||'mid';}
function effDeadline(t){const p=parentOf(t);return t.deadline||(p&&p.deadline)||null;}
function catRank(c){const i=S.cats.indexOf(c);return i<0?999:i;}
function slotTitle(t){const p=parentOf(t);return p?p.title+'：'+t.title:t.title;}
function cmpTasks(a,b){
  const d0=PRIO[effPrio(a)]-PRIO[effPrio(b)];if(d0)return d0;
  const da=effDeadline(a),db=effDeadline(b);
  if(da!==db){if(!da)return 1;if(!db)return -1;const x=new Date(da)-new Date(db);if(x)return x;}
  const c=catRank(a.cat)-catRank(b.cat);if(c)return c;
  const pa=parentOf(a),pb=parentOf(b);
  const ca=String((pa||a).created),cb=String((pb||b).created);
  if(ca!==cb)return ca.localeCompare(cb);
  return String(a.created).localeCompare(String(b.created));
}
function prioTag(t){const p=t.prio||(parentOf(t)?null:'mid');return p&&p!=='mid'?'<span class="pr '+p+'">'+PRIO_JA[p]+'</span>':'';}
function kidsDone(t){const k=childrenOf(t);return k.filter(x=>x.done).length+'/'+k.length;}
function sumEst(t){return childrenOf(t).reduce((a,x)=>a+(x.est||0),0);}
function allocLabel(t){return hasKids(t)?'確保時間 合計 '+fmtDur(sumEst(t))+'（サブタスク '+childrenOf(t).length+'つ）':'確保時間 '+fmtDur(t.est);}
function syncParent(p){
  if(!p)return;const k=childrenOf(p);if(!k.length)return;
  const all=k.every(x=>x.done),now=new Date().toISOString();
  if(all&&!p.done){p.done=true;p.doneAt=now;p.log.push({t:now,x:'サブタスクが全部終わったので完了'});}
  if(!all&&p.done){p.done=false;p.log.push({t:now,x:'未完了のサブタスクがあるので再開'});}
}
function markDone(t,now){
  t.done=true;t.doneAt=now;t.log.push({t:now,x:'完了'});
  childrenOf(t).forEach(k=>{if(!k.done){k.done=true;k.doneAt=now;k.log.push({t:now,x:'親タスクの完了で完了'});}});
  syncParent(parentOf(t));
}
function reopen(t,now){t.done=false;t.log.push({t:now,x:'再開'});syncParent(parentOf(t));}
function removeTask(t){
  const ids=[t.id,...childrenOf(t).map(x=>x.id)];
  S.tasks=S.tasks.filter(x=>!ids.includes(x.id));
  S.events=S.events.filter(e=>!(ids.includes(e.taskId)&&e.auto));
  syncParent(parentOf(t));
}
function wantAlloc(t){if(hasKids(t))childrenOf(t).filter(k=>!k.done).forEach(k=>k.pendingAlloc=true);else t.pendingAlloc=true;}
function manualFuture(t){const n=new Date(),k=dkey(n),nm=n.getHours()*60+n.getMinutes();
  return S.events.filter(e=>e.taskId===t.id&&!e.auto&&evEndDate(e)>n).reduce((a,e)=>a+e.end-(e.date===k?Math.max(e.start,nm):e.start),0);}
function replanAll(exceptId){
  const now=new Date(),todayK=dkey(now),nowAbs=now.getHours()*60+now.getMinutes();
  const notStarted=e=>e.date>todayK||(e.date===todayK&&e.start>nowAbs);
  const sig=t=>S.events.filter(e=>e.taskId===t.id&&e.auto&&notStarted(e)).map(e=>e.date+e.start+'-'+e.end).sort().join();
  const before={};S.tasks.forEach(t=>before[t.id]=sig(t));
  const list=S.tasks.filter(t=>!t.done&&!hasKids(t)&&(t.pendingAlloc||S.events.some(e=>e.taskId===t.id&&e.auto&&notStarted(e))));
  const need={};
  for(const t of list){
    if(t.pendingAlloc)need[t.id]=Math.max(0,(t.est||S.settings.defEst)-manualFuture(t));
    else need[t.id]=(t.allocShort||0)+S.events.filter(e=>e.taskId===t.id&&e.auto&&notStarted(e)).reduce((a,e)=>a+e.end-e.start,0);
  }
  S.events=S.events.filter(e=>!(e.auto&&notStarted(e)));
  list.sort(cmpTasks);
  for(const t of list)placeTask(t,need[t.id]);
  let moved=0;S.tasks.forEach(t=>{if(t.id!==exceptId&&before[t.id]&&before[t.id]!==sig(t)&&!t.done)moved++;});
  return moved;
}
function placeTask(t,need){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const nowMin=ceil5(now.getHours()*60+now.getMinutes());
  const {maxBlock,brk}=S.settings;
  for(let i=0;i<62&&need>0;i++){
    const d=addDays(today,i);
    for(const g of gapsOf(busyFor(d),i===0?nowMin:0)){
      let cur=g[0];
      while(need>0&&g[1]-cur>=10){
        let len=Math.min(need,maxBlock,g[1]-cur);if(len<5)break;
        if(len<need&&need-len<10&&need-10>=10)len=need-10;
        S.events.push({id:uid(),title:slotTitle(t),cat:t.cat,date:dkey(d),start:cur,end:cur+len,place:null,taskId:t.id,auto:true});
        need-=len;cur+=len;
        if(need>0)cur+=brk;
      }
      if(need<=0)break;
    }
  }
  if(t.pendingAlloc)t.allocAt=now.toISOString();
  t.pendingAlloc=false;t.allocShort=need>0?need:0;
}
function movedText(n){return n?'\n↻ ほかのタスク'+n+'件の割り当てを、優先順に組み直しました':'';}
function evEndDate(e){return atTime(fromKey(e.date),e.end);}
function futureSlots(t){const n=new Date();return S.events.filter(e=>e.taskId===t.id&&evEndDate(e)>n).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);}
function lastSlotEnd(t){let m=null;S.events.forEach(e=>{if(e.taskId===t.id){const d=evEndDate(e);if(!m||d>m)m=d;}});return m;}
function dropFutureAuto(t){const n=new Date();S.events=S.events.filter(e=>!(e.taskId===t.id&&e.auto&&evEndDate(e)>n));}
function dropAllAuto(t){S.events=S.events.filter(e=>!(e.taskId===t.id&&e.auto));}
function allocText(t){
  if(hasKids(t))return childrenOf(t).filter(k=>!k.done).map(k=>'・'+k.title+'：'+allocText(k).replace(/^割り当て：/,'')).join('\n');
  const all=futureSlots(t);
  if(!all.length)return '割り当てられる空きがありませんでした';
  const dl=effDeadline(t);
  const late=dl&&all.some(e=>evEndDate(e)>new Date(dl));
  return '割り当て：'+all.slice(0,3).map(evLabel).join('、')+(all.length>3?' ほか'+(all.length-3)+'回':'')
    +(t.allocShort?'\n⚠ '+fmtDur(t.allocShort)+'ぶん入りきりませんでした':'')+(late?'\n⚠ 期限に間に合わない割り当てがあります':'');
}
function needsAlloc(t){
  if(t.done||hasKids(t)||futureSlots(t).length)return false;
  const last=lastSlotEnd(t);
  if(!last)return true;
  return Date.now()-last.getTime()>=24*3600*1000;
}
function whenLabel(t){
  if(t.deadline)return '期限 '+fmtDL(t)+'まで';
  const p=parentOf(t);if(p&&p.deadline)return '期限 '+fmtDL(p)+'まで（親タスクと同じ）';
  return '期限なし';
}
function prioLabel(t){return '優先度 '+PRIO_JA[effPrio(t)];}
function topTask(text){
  let best=null;
  for(const t of S.tasks.filter(t=>!t.done&&!t.parentId)){if(text.includes(t.title)&&(!best||t.title.length>best.title.length))best=t;}
  return best;
}
function newTaskFrom(p,raw,now,extra){
  let deadline=null,dlNoTime=false;
  if(p.date||p.t!=null){
    let d=p.date||new Date(now.getFullYear(),now.getMonth(),now.getDate());
    let min=p.t!=null?p.t:(23*60+59);dlNoTime=p.t==null;
    let dt=atTime(d,min);
    if(!p.date&&dt<now)dt=addDays(dt,1);
    deadline=dt.toISOString();
  }
  const t=Object.assign({id:uid(),title:p.title,cat:p.cat||selCat||'未分類',deadline,dlNoTime,prio:p.prio||null,est:p.dur||S.settings.defEst,estGuess:!p.dur,
    done:false,created:now.toISOString(),log:[{t:now.toISOString(),x:'登録：'+raw}],pendingAlloc:true},extra||{});
  S.tasks.push(t);return t;
}
function atTime(date,min){const d=new Date(date);d.setHours(0,0,0,0);d.setMinutes(min);return d;}
function findTask(text){
  const act=S.tasks.filter(t=>!t.done);
  let best=null;
  for(const t of act){ if(text.includes(t.title)&&(!best||t.title.length>best.title.length))best=t; }
  return best;
}
function futureEvents(){const k=dkey(new Date());return S.events.filter(e=>!e.auto&&e.date>=k);}
function recDur(e){return fmtDur(e.end-e.start);}
function findEvent(text){
  let best=null;
  for(const e of futureEvents()){ if(text.includes(e.title)&&(!best||e.title.length>best.title.length))best=e; }
  return best;
}
function evIcon(e){return e&&e.rec?'📝':'📅';}
function evKind(e){return e&&e.rec?'記録':'予定';}
function evLabel(e){const d=fromKey(e.date);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+') '+hm(e.start)+'–'+hm(e.end);}
function applyToEvent(ev,p,raw){
  if(p.cancel){S.events=S.events.filter(x=>x.id!==ev.id);return '🗑 '+evKind(ev)+'「'+ev.title+'」を削除しました';}
  const out=[],len=ev.end-ev.start;
  if(p.date){ev.date=dkey(p.date);out.push('日付');}
  if(p.tStart!=null){ev.start=p.tStart;ev.end=p.tEnd>p.tStart?p.tEnd:p.tStart+len;out.push('時間');}
  else if(p.t!=null){ev.start=p.t;ev.end=p.t+(p.dur||len);out.push('時間');}
  else if(p.dur!=null){ev.end=ev.start+p.dur;out.push('長さ');}
  if(p.cat){ev.cat=p.cat;out.push('カテゴリ');}
  if(p.place){ev.place=p.place;out.push('場所');}
  if(!out.length)return null;
  if(ev.end>1440)ev.end=1440;
  return '✎ '+evIcon(ev)+' '+evKind(ev)+'「'+ev.title+'」の'+out.join('・')+'を変えました\n'+evLabel(ev)+'（'+ev.cat+'）'+(ev.place?' @'+ev.place:'');
}


let snapshot=null;
function handle(raw){
  raw=raw.trim(); if(!raw)return;
  const now=new Date();
  addMsg('me',raw);
  pushHistory(raw);
  if(/^(使い方|ヘルプ|help|\?)$/i.test(raw)){addMsg('app',HELP);return finish();}
  if(/^(シフト|シフト取り込み|ジョブカン)$/.test(raw)){showView('setView');$('#setView').scrollTop=0;setTimeout(()=>$('#shIn').focus(),50);addMsg('app','設定の「ジョブカンのシフト取り込み」を開きました。');return finish();}
  if(/^(今日|予定|明日|カレンダー)$/.test(raw)){calMode='day';calDate=addDays(new Date(new Date().setHours(0,0,0,0)),raw==='明日'?1:0);showView('dayView');renderDay();addMsg('app','カレンダーを開きました。');return finish();}
  snapshot=JSON.stringify({tasks:S.tasks,events:S.events});
  const recM=raw.match(/^記録(?:[\s　:：]+(.*))?$/);
  if(recM){
    const p=parse(recM[1]||'',now);
    if(!p.title){addMsg('app','記録する内容が読み取れませんでした。\n例：記録 13:00-14:30 レポート ／ 記録 30分 洗濯');snapshot=null;return finish();}
    const todayD=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const date=p.date||todayD,isToday=dkey(date)===dkey(todayD);
    const nowMin=Math.floor((now.getHours()*60+now.getMinutes())/5)*5;
    const dur=p.dur??p.spent;let s,e,guess=false;
    if(p.tStart!=null){s=p.tStart;e=p.tEnd>s?p.tEnd:s+(dur||30);if(!(p.tEnd>s)&&!dur)guess=true;}
    else if(p.t!=null){s=p.t;e=s+(dur||30);if(!dur)guess=true;}
    else if(isToday){e=Math.max(5,nowMin);s=Math.max(0,e-(dur||30));if(!dur)guess=true;}
    else{addMsg('app','今日以外の記録は時刻を書いてください。\n例：記録 昨日 13:00-14:30 レポート');snapshot=null;return finish();}
    const cat=p.cat||selCat||'未分類';
    const ev={id:uid(),title:p.title,cat,date:dkey(date),start:s,end:Math.min(1440,e),place:p.place||null,rec:true};
    S.events.push(ev);
    addMsg('app','📝 記録しました\n'+ev.title+'（'+cat+'）\n'+evLabel(ev)+'（'+recDur(ev)+(guess?'・仮':'')+'）',true,refOf(ev));
    return finish();
  }
  const ren=raw.match(/^(.+?)\s*(?:→|->|⇒|＝>)\s*(.+)$/);
  if(ren){
    const tg=findTask(ren[1].trim())||findEvent(ren[1].trim());
    if(tg&&ren[2].trim()){
      const old=tg.title;tg.title=ren[2].trim();
      if(tg.log)tg.log.push({t:now.toISOString(),x:'内容変更：'+old+' → '+tg.title});
      addMsg('app','✎ 内容を変えました\n'+old+' → '+tg.title,true,refOf(tg));return finish();
    }
  }
  const subM=raw.match(/^(.+?)\s*[>＞]\s*(.+)$/);
  if(subM){
    const anyHit=findTask(subM[1].trim());
    const par=topTask(subM[1].trim());
    if(anyHit&&anyHit.parentId&&(!par||anyHit.title.length>par.title.length)){addMsg('app','サブタスクの中には、さらにサブタスクを作れません。\n「'+parentOf(anyHit).title+' > '+subM[2].trim()+'」のように親タスクの名前で送ってください。');snapshot=null;return finish();}
    if(par){
      const parts=subM[2].split(/[、,，]/).map(s=>s.trim()).filter(Boolean),lines=[];let first=null;
      parts.forEach((part,i)=>{
        const kid=childrenOf(par).find(k=>part.startsWith(k.title));
        if(kid){
          const r=applyToTask(kid,parse(part.slice(kid.title.length),now),now,part,true);
          if(r){lines.push(r.split('\n').slice(0,2).join('：'));first=first||kid;}
          return;
        }
        const p=parse(part,now);if(!p.title)return;
        if(!p.cat)p.cat=par.cat;
        const k=newTaskFrom(p,par.title+' > '+part,now,{parentId:par.id,created:new Date(now.getTime()+i).toISOString(),cat:p.cat});
        lines.push('🧩 '+k.title+'（'+allocLabel(k)+(p.dur?'':'・仮')+(k.deadline?'・'+whenLabel(k):'')+(k.prio?'・優先度 '+PRIO_JA[k.prio]:'')+'）');
        first=first||k;
      });
      if(!lines.length){addMsg('app','サブタスクの内容が読み取れませんでした。\n例：'+par.title+' > 資料集め 1時間、構成 30分');snapshot=null;return finish();}
      syncParent(par);
      par.log.push({t:now.toISOString(),x:'サブタスク：'+subM[2].trim()});
      const mv=replanAll();
      const at=par.done?'':allocText(par);
      addMsg('app','🧩 「'+par.title+'」のサブタスク\n'+lines.join('\n')+(at?'\n'+at:'')+'\nサブタスク '+kidsDone(par)+' 完了'+(par.done?'（全部終わったので「'+par.title+'」も完了）':'')+(mv?'\n↻ ほかのタスクも優先順に組み直しました':''),true,refOf(first||par));
      return finish();
    }
  }
  const hit=findTask(raw);
  if(hit){
    const rest=raw.replace(hit.title,' ');
    const p=parse(rest,now);
    if(p.tStart!=null||(p.asEv&&p.t!=null&&!p.until)){
      if(hasKids(hit)){addMsg('app','サブタスクがあるタスクは、サブタスクごとに予定に入れてください。\n例：'+childrenOf(hit)[0].title+' 明日 14:00-15:00');snapshot=null;return finish();}
      const s0=p.tStart??p.t, e0=p.tEnd??(s0+Math.max(15,hit.est||S.settings.defEst));
      const nowMin=now.getHours()*60+now.getMinutes();
      const d=p.date||(s0<nowMin?addDays(now,1):now);
      const ev=addLinkedEvent(hit,dkey(d),s0,e0);
      const mv=replanAll(hit.id);
      addMsg('app','📅 予定にも入れました（タスクはそのまま残っています）\n'+slotTitle(hit)+'\n'+evLabel(ev)+movedText(mv),true,refOf(ev));
      return finish();
    }
    const changed=applyToTask(hit,p,now,raw);
    if(changed){addMsg('app',changed,true,refOf(hit));return finish();}
  }
  const evHit=findEvent(raw);
  if(evHit){
    const p=parse(raw.replace(evHit.title,' '),now);
    const changed=applyToEvent(evHit,p,raw);
    if(changed){addMsg('app',changed+movedText(replanAll()),true,refOf(evHit));return finish();}
  }
  const p=parse(raw,now);
  if(!p.title){addMsg('app','タスク名が読み取れませんでした。「使い方」と送ると書き方の例が出ます。');snapshot=null;return finish();}
  const cat=p.cat||selCat||'未分類';
  if(!p.until&&(p.tStart!=null||(p.t!=null&&!p.pct))){
    const date=p.date||(()=>{const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());const s=p.tStart??p.t;return (s<now.getHours()*60+now.getMinutes())?addDays(d,1):d;})();
    const s=p.tStart??p.t;
    const e=p.tEnd??(s+(p.dur||60));
    const ev={id:uid(),title:p.title,cat,date:dkey(date),start:s,end:e,place:p.place||matchPlace(p.title)};
    S.events.push(ev);
    const pl=ev.place?placeOf(ev.place):null;
    const mv=replanAll();
    addMsg('app','📅 予定を入れました（時刻固定）\n'+ev.title+'（'+cat+'）\n'+(date.getMonth()+1)+'/'+date.getDate()+'('+WD[date.getDay()]+') '+hm(s)+'–'+hm(e)
      +(pl&&pl.travel?'\n移動 '+pl.travel+'分 を前後に確保しました':'')+movedText(mv),true,refOf(ev));
    return finish();
  }
  const t=newTaskFrom(p,raw,now);
  const mv=replanAll(t.id);
  addMsg('app','📌 タスクを登録しました\n'+t.title+'（'+t.cat+'）\n'+whenLabel(t)+'\n'+prioLabel(t)+'\n'+allocLabel(t)+(p.dur?'':'（仮）')+'\n'+allocText(t)+movedText(mv),true,refOf(t));
  finish();
}
function applyToTask(t,p,now,raw,noPlan){
  const out=[],nowS=now.toISOString(),kids=hasKids(t),par=parentOf(t);
  if(p.cancel){const n=childrenOf(t).length;removeTask(t);if(!noPlan)replanAll();return '🗑「'+slotTitle(t)+'」を削除しました'+(n?'（サブタスク'+n+'つも一緒に）':'');}
  if((p.pct!=null&&p.pct<100)||p.spent!=null||p.left!=null)
    return '進み具合や作業した時間は、タスクには付けない形にしました。\n終わったら「'+t.title+' 完了」、やったことは「記録 30分 '+t.title+'」のように送ってください。';
  if(kids&&p.dur!=null)return '「'+t.title+'」にはサブタスクがあるので、確保時間はサブタスクごとに決めます。\n例：'+childrenOf(t)[0].title+' 1時間';
  let realloc=/割り?当て|わりあて/.test(raw);
  if(p.pct!=null){markDone(t,nowS);out.push('完了'+(kids?'（サブタスクも全部）':''));realloc=false;}
  if(p.dur!=null){t.est=p.dur;t.estGuess=false;realloc=true;out.push('確保時間 '+fmtDur(p.dur));}
  if(realloc&&!t.done){wantAlloc(t);if(p.dur==null)out.push('割り当て直し');}
  if(p.date||p.t!=null){
    const cur=t.deadline||effDeadline(t);
    const d=p.date||(cur?new Date(cur):new Date(now.getFullYear(),now.getMonth(),now.getDate()));
    t.deadline=atTime(d,p.t!=null?p.t:23*60+59).toISOString();t.dlNoTime=p.t==null;out.push('期限 '+fmtDL(t)+'まで');
  }
  if(p.noDl){t.deadline=null;out.push(par&&par.deadline?'期限なし（親タスクの期限に従う）':'期限なし');}
  if(p.prio){t.prio=p.prio;out.push('優先度 '+PRIO_JA[p.prio]);}
  if(p.cat){const old=t.cat;t.cat=p.cat;out.push('カテゴリ '+p.cat);if(kids)childrenOf(t).forEach(k=>{if(k.cat===old)k.cat=p.cat;});}
  if(!out.length)return null;
  t.log.push({t:nowS,x:raw});
  const mv=noPlan?0:replanAll(t.id);
  const done=t.done;
  return (done?'✅ ':'📈 ')+slotTitle(t)+'\n'+out.join(' ／ ')
    +(done?(par?'\n「'+par.title+'」のサブタスク '+kidsDone(par)+' 完了'+(par.done?'（全部終わったので親タスクも完了）':''):'')
      :(out.some(o=>o.startsWith('期限'))?'':'\n'+whenLabel(t))+(p.dur!=null?'':'\n'+allocLabel(t))+'\n'+allocText(t))
    +movedText(mv);
}
function linkedEvents(t){return S.events.filter(e=>e.taskId===t.id);}
function addLinkedEvent(t,dateKey,s,e){
  const ev={id:uid(),title:t.title,cat:t.cat,date:dateKey,start:s,end:Math.min(1440,e),place:matchPlace(t.title),taskId:t.id};

const HELP=`■ 言葉
・確保時間：そのタスクにカレンダー上で使う時間の合計
・割り当て：確保時間をカレンダーの空きに置いたもの
・期限：いつまでに終わらせるか（やる日とは別）

■ 新しく入れる（3種類）
📌 タスク … 内容＋確保時間。期限・優先度・カテゴリは付けても付けなくてもいい
　例：金曜17時までにレポート 2時間 #高 #学校
　例：明日 銀行で振込 15分 #手続き
　例：部屋の片付け 1時間（期限なし・確保時間を書かないと30分）
📅 予定 … 時刻を書く（「まで」は付けない）
　例：木曜 19時 映画 ／ 11/10 10:00-12:00 面接 @大学
📝 記録 … 実際にやったこと。先頭に「記録」
　例：記録 13:00-14:30 レポート ／ 記録 30分 洗濯（今終わった扱い）

■ サブタスク（親 > 子）
　例：レポート > 資料集め 1時間、構成 30分、執筆 2時間
・カレンダーに入るのはサブタスクのほう。親の確保時間は合計になる
・サブタスクが全部終わると、親も完了になる
・期限・優先度を書かないサブタスクは親のものに従う
・あとから変えるときも同じ形：レポート > 資料集め 完了

■ すでにあるものを変える（内容のあとに書く）
・レポート 完了 ／ レポート 削除
・レポート 来週月曜まで ／ レポート 期限なし（期限）
・レポート 3時間（確保時間）／ レポート #高（優先度）／ レポート #学校（カテゴリ）
・レポート 割り当て直す（今から先の空きに置き直す）
・レポート 明日 14:00-16:00（タスクを残したまま予定にも入れる）
・レポート → 卒論レポート（内容）
・映画 18:30-21:00 ／ 映画 土曜 ／ 映画 削除（予定）

■ 優先順位（何かを入れたり変えたりするたびに組み直す）
1. 優先度（#高 > #中 > #低。書かないと中）
2. → 期限が近い順
3. → カテゴリの順番（設定で並べ替え。上ほど優先）
始まっている割り当てと、時間の過ぎた割り当ては動かしません。

■ そのほか
・日付：今日・明日・明後日・昨日・月〜日曜・来週〇曜・11/5
・時刻：17時・17時半・17:30・午後3時
・#カテゴリ　@場所（移動時間を確保）
・何行かまとめて貼ると、1行ずつ送ったのと同じになる
・「今日」「明日」でカレンダー、「シフト」でシフト取り込み
・返信の「✎ 編集」で、その項目を全部直せる
・割り当てが全部過ぎても未完了のタスクは、24時間たつとリストの上に出ます`;


function busyFor(d){
  const k=dkey(d),wd=d.getDay(),prev=(wd+6)%7,out=[];
  for(const r of S.routines){
    const s=toMin(r.start),e=toMin(r.end);
    if(e>s){ if(r.days.includes(wd))out.push({type:'routine',title:r.title,s,e}); }
    else{
      if(r.days.includes(wd))out.push({type:'routine',title:r.title,s,e:1440});
      if(r.days.includes(prev)&&e>0)out.push({type:'routine',title:r.title,s:0,e});
    }
  }
  for(const ev of S.events.filter(e=>e.date===k)){
    const pl=ev.place?placeOf(ev.place):null,tr=pl?+pl.travel||0:0;
    if(ev.rec){out.push({type:'rec',title:ev.title,cat:ev.cat,s:ev.start,e:ev.end,id:ev.id});continue;}
    if(ev.auto){const t=S.tasks.find(x=>x.id===ev.taskId);
      const dl=t?effDeadline(t):null;
      out.push({type:'task',title:ev.title+(t&&t.done?'（完了）':''),cat:ev.cat,s:ev.start,e:ev.end,id:ev.taskId,icon:t&&t.parentId?'🧩':'📌',late:!!(t&&!t.done&&dl&&evEndDate(ev)>new Date(dl)),dlText:dl?(t.deadline?fmtDL(t):fmtDL(parentOf(t))):''});continue;}
    if(tr){out.push({type:'travel',title:'移動（→'+ev.place+'）',s:Math.max(0,ev.start-tr),e:ev.start});
           out.push({type:'travel',title:'移動（'+ev.place+'→）',s:ev.end,e:Math.min(1440,ev.end+tr)});}
    out.push({type:'event',title:ev.title+(ev.taskId?'（作業）':''),cat:ev.cat,s:ev.start,e:ev.end,id:ev.id});
  }
  return out.sort((a,b)=>a.s-b.s);
}
function gapsOf(busy,from){
  const g=[];let cur=from;
  for(const b of busy){ if(b.s>cur)g.push([cur,b.s]); cur=Math.max(cur,b.e); }
  if(cur<1440)g.push([cur,1440]);
  return g.filter(x=>x[1]-x[0]>=10);
}
function plan(days){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const nowMin=ceil5(now.getHours()*60+now.getMinutes());
  const nowAbs=now.getHours()*60+now.getMinutes(),todayK=dkey(now);
  const booked=t=>linkedEvents(t).reduce((a,e)=>a+(e.date>todayK?e.end-e.start:e.date===todayK?Math.max(0,e.end-Math.max(e.start,nowAbs)):0),0);
  const tasks=S.tasks.filter(t=>!t.done&&t.remaining>0).map(t=>({t,rem:Math.max(0,t.remaining-booked(t))}))
    .sort((a,b)=>(a.t.deadline?new Date(a.t.deadline):Infinity)-(b.t.deadline?new Date(b.t.deadline):Infinity)||a.t.created.localeCompare(b.t.created));
  const {maxBlock,brk}=S.settings,res=[];
  for(let i=0;i<days;i++){
    const d=addDays(today,i),dk=dkey(d),busy=busyFor(d),blocks=busy.slice();
    for(const g of gapsOf(busy,i===0?nowMin:0)){
      let cur=g[0];
      while(g[1]-cur>=10){
        const it=tasks.find(x=>x.rem>0); if(!it)break;
        let len=Math.min(it.rem,maxBlock,g[1]-cur); if(len<5)break;
        if(len<it.rem&&it.rem-len<10&&it.rem-10>=10)len=it.rem-10;
        const end=cur+len, endDate=atTime(d,end);
        blocks.push({type:'task',title:it.t.title,cat:it.t.cat,s:cur,e:end,late:it.t.deadline&&endDate>new Date(it.t.deadline),id:it.t.id,icon:'📌',dlText:it.t.deadline?fmtDL(it.t):''});
        it.rem-=len; cur=end;
        if(g[1]-cur>=10+brk&&tasks.some(x=>x.rem>0)){blocks.push({type:'break',title:'休憩',s:cur,e:cur+brk});cur+=brk;}
      }
    }
    blocks.sort((a,b)=>a.s-b.s);
    res.push({date:d,blocks});
  }
  const left=tasks.filter(x=>x.rem>0).map(x=>({title:x.t.title,rem:x.rem}));
  return {days:res,left};
}

  const tk=dkey(new Date()),n=new Date(),nowMin=n.getHours()*60+n.getMinutes();

  for(let i=0;i<7;i++){const d=addDays(ws,i),k=dkey(d);
    h+='<div class="wh'+(k===tk?' today':'')+(i===0?' sun':i===6?' sat':'')+'" data-go="'+k+'"><span>'+WD[i]+'</span><b>'+d.getDate()+'</b>'
      +(dueOn(k).filter(t=>!t.done).length?'<i title="期限">📌'+dueOn(k).filter(t=>!t.done).length+'</i>':'')+'</div>';}
  h+='</div><div class="wkbody" style="height:'+(1440*PX)+'px"><div class="tcol">';
  for(let H=0;H<24;H++)h+='<div class="hl" style="top:'+(H*60*PX)+'px">'+H+'</div>';
  h+='</div>';
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),k=dkey(d),past=k<tk;
    h+='<div class="wcol'+(k===tk?' today':'')+'" data-go="'+k+'">';
    for(let H=1;H<24;H++)h+='<div class="gl" style="top:'+(H*60*PX)+'px"></div>';
    for(const b of dayBlocks(d,P)){
      if(b.type==='break')continue;
      const top=b.s*PX,ht=Math.max(8,(b.e-b.s)*PX-1);
      h+='<div class="wb b-'+b.type+(past?' past':'')+(b.late?' lateb':'')+'" style="top:'+top+'px;height:'+ht+'px;--c:'+catColor(b.cat)+'"'+(b.id?' data-open="'+b.id+'"':'')+'>'
        +(ht>=14?'<span>'+esc(b.title)+'</span>':'')+'</div>';
    }
    for(const t of dueOn(k).filter(t=>!t.done&&!t.dlNoTime)){
      const dd=new Date(t.deadline),m=dd.getHours()*60+dd.getMinutes();
      h+='<div class="dlmark" style="top:'+(m*PX)+'px;--c:'+catColor(t.cat)+'" data-open="'+t.id+'"><span>📌'+esc(t.title)+'</span></div>';
    }
    if(k===tk)h+='<div class="nowline" style="top:'+(nowMin*PX)+'px"></div>';
    h+='</div>';
  }
  return h+'</div></div><div class="legend">色はカテゴリ。塗りつぶし＝予定、枠線だけ＝記録、薄い色＋左の線＝タスクの割り当て、グレー＝ルーティン、斜線＝移動、📌の横線＝期限の時刻、曜日の下の📌＝その日が期限のタスクの数。曜日を押すとその日の一覧へ</div>';
}

function dayHTML(){
  const d=calDate,k=dkey(d),tk=dkey(new Date());
  const P=k>=tk?planFor(d):null;
  const blocks=dayBlocks(d,P);
  const n=new Date(),nowMin=n.getHours()*60+n.getMinutes();
  let h='';
  const due=dueOn(k);
  const showFrom=k===tk?Math.floor(nowMin/5)*5:0;
  const dlMin=t=>{const x=new Date(t.deadline);return x.getHours()*60+x.getMinutes();};
  const topDue=due.filter(t=>t.dlNoTime||t.done||dlMin(t)<showFrom);
  if(topDue.length)h+='<div class="duebox"><div class="sm">この日が期限</div>'+topDue.map(t=>'<div class="dueit'+(t.done?' done':'')+'" data-open="'+t.id+'"'+cv(t.cat)+'><span class="dot" style="background:var(--c)"></span>📌 '+esc(slotTitle(t))+(t.dlNoTime?'':' <span class="sm">'+fmtDL(t).split(' ')[1]+'まで</span>')+(t.done?' <span class="sm">完了</span>':'')+'</div>').join('')+'</div>';
  due.filter(t=>!topDue.includes(t)).forEach(t=>blocks.push({type:'dl',s:dlMin(t),e:dlMin(t),title:slotTitle(t),cat:t.cat,id:t.id}));
  blocks.sort((a,b)=>a.s-b.s||(a.type==='dl'?-1:b.type==='dl'?1:0));
  const pastRec=blocks.filter(b=>b.type==='rec'&&b.e<=showFrom);
  if(pastRec.length)h+='<div class="recbox"><div class="sm">今日の記録（'+fmtDur(pastRec.reduce((a,b)=>a+b.e-b.s,0))+'）</div>'+pastRec.map(b=>'<div class="blk b-rec" data-open="'+b.id+'"'+cv(b.cat)+'><span class="tm">'+hm(b.s)+'–'+hm(b.e)+'</span><span><span class="ti">📝 '+esc(b.title)+'</span> <span class="sm">'+esc(b.cat)+'</span></span></div>').join('')+'</div>';
  let cur=showFrom;
  for(const b of blocks){
    if(b.type==='dl'){
      if(b.s>cur&&b.s-cur>=10){h+='<div class="blk b-free"><span class="tm">'+hm(cur)+'–'+hm(b.s)+'</span><span>空き '+fmtDur(b.s-cur)+'</span></div>';cur=b.s;}
      h+='<div class="blk b-dl" data-open="'+b.id+'"'+cv(b.cat)+'><span class="tm">'+hm(b.s)+'</span><span><span class="ti">📌 期限：'+esc(b.title)+'</span></span></div>';
      continue;
    }
    if(b.e<=showFrom)continue;
    if(b.s>cur&&b.s-cur>=10)h+='<div class="blk b-free"><span class="tm">'+hm(cur)+'–'+hm(b.s)+'</span><span>空き '+fmtDur(b.s-cur)+'</span></div>';
    const isNow=k===tk&&b.s<=nowMin&&nowMin<b.e;
    if(b.type==='break')h+='<div class="blk b-break"><span class="tm">'+hm(b.s)+'–'+hm(b.e)+'</span><span>休憩</span></div>';
    else h+='<div class="blk b-'+b.type+(isNow?' b-now':'')+(k<tk?' past':'')+'"'+(b.id?' data-open="'+b.id+'"':'')+(b.cat?cv(b.cat):'')+'><span class="tm">'+hm(Math.max(b.s,showFrom))+'–'+hm(b.e)+'</span><span><span class="ti">'+(b.type==='event'?'📅 ':b.type==='rec'?'📝 ':b.type==='task'?b.icon+' ':'')+esc(b.title)+'</span>'
      +(b.cat?' <span class="sm">'+esc(b.cat)+'</span>':'')+(b.dlText?'<br><span class="sm">期限 '+b.dlText+'まで</span>':'')+(b.late?' <span class="sm late">期限に間に合わない</span>':'')+'</span></div>';
    cur=Math.max(cur,b.e);
  }
  if(cur<1440&&1440-cur>=10)h+='<div class="blk b-free"><span class="tm">'+hm(cur)+'–24:00</span><span>空き</span></div>';
  return h;
}
function renderTasks(){
  const isTop=t=>!t.parentId||!parentOf(t);
  const act=S.tasks.filter(t=>!t.done&&isTop(t)),done=S.tasks.filter(t=>t.done&&isTop(t)).slice(-20).reverse();
  const groups={};act.forEach(t=>(groups[t.cat]=groups[t.cat]||[]).push(t));
  let html='';
  const na=S.tasks.filter(t=>!t.done).filter(needsAlloc);
  if(na.length)html+='<div class="notice"><b>⚠ 未完了で、割り当てが残っていないタスク（'+na.length+'）</b>'+na.map(t=>{const l=lastSlotEnd(t);
    return '<div class="nrow" data-id="'+t.id+'"><span>'+(t.parentId?'🧩 ':'📌 ')+esc(slotTitle(t))+'<span class="sm">　'+(l?'最後の割り当て '+fmtDT(l.toISOString()):'割り当てられませんでした')+'</span></span><span class="nacts"><button data-n="alloc">割り当てる</button><button data-n="done">完了</button></span></div>';}).join('')+'</div>';
  const card=t=>{const fs=futureSlots(t),kids=childrenOf(t),sub=!!t.parentId;
    const dl=effDeadline(t),late=!t.done&&dl&&new Date(dl)<new Date();
    return '<div class="card'+(sub?' sub':'')+(t.done?' isdone':'')+'" data-id="'+t.id+'"'+cv(t.cat)+'><div class="top"><span class="nm">'+(sub?'🧩 ':'')+esc(t.title)+prioTag(t)+'</span></div>'
    +(sub&&!t.deadline?'':'<div class="meta'+(late?' late':'')+'">'+whenLabel(t)+'</div>')
    +(kids.length?'<div class="prog">サブタスク '+kidsDone(t)+' 完了</div><div class="bar"><i style="width:'+Math.round(kids.filter(x=>x.done).length/kids.length*100)+'%"></i></div>':'')
    +'<div class="meta">'+(t.done?'完了':allocLabel(t))+'</div>'
    +(t.memo?'<div class="memo">'+esc(t.memo)+'</div>':'')
    +(!t.done&&!kids.length&&fs.length?'<div class="meta">割り当て：'+fs.map(evLabel).join('、')+'</div>':'')
    +(!t.done&&!kids.length&&!fs.length?'<div class="meta">割り当てなし</div>':'')
    +'<div class="acts">'+(t.done?'<button data-a="reopen">戻す</button>':'<button data-a="done">完了</button><button data-a="alloc">割り当て直す</button>'+(kids.length?'':'<button data-a="toev">📅 予定に入れる</button>'))
    +(sub?'':'<button data-a="sub">🧩 サブタスク</button>')+'<button data-a="edit">編集</button><button data-a="log">履歴</button><button data-a="del">削除</button></div>'
    +'<div class="log">'+t.log.map(l=>{const d=new Date(l.t);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'　'+esc(l.x);}).join('<br>')+'</div></div>'
    +kids.map(card).join('');};
  const cats=Object.keys(groups).sort((a,b)=>catRank(a)-catRank(b));
  cats.forEach(c=>{
    groups[c].sort(cmpTasks);
    html+='<h2'+cv(c)+'><span class="dot"></span>'+esc(c)+'（'+groups[c].length+'）'+'</h2>'+groups[c].map(card).join('');
  });
  if(!act.length)html+='<div class="empty">進行中のタスクはありません</div>';
  const evs=S.events.filter(e=>!e.rec&&!e.auto&&e.date>=dkey(new Date())).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
  if(evs.length)html+='<h2>📅 これからの予定（時刻固定）</h2>'+evs.map(e=>{const d=fromKey(e.date);return '<div class="card" data-ev="'+e.id+'"'+cv(e.cat)+'><div class="top"><span class="nm">📅 '+esc(e.title)+'</span><span class="meta">'+(d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+') '+hm(e.start)+'–'+hm(e.end)+'</span></div>'
    +'<div class="meta">'+esc(e.cat)+(e.place?' ／ @'+esc(e.place):'')+(e.taskId&&S.tasks.some(t=>t.id===e.taskId)?' ／ 📌 タスクの作業時間':'')+'</div>'+(e.memo?'<div class="memo">'+esc(e.memo)+'</div>':'')+'<div class="acts"><button data-a="evedit">編集</button><button data-a="evdel">削除</button></div></div>';}).join('');
  const recFrom=dkey(addDays(todayStart(),-13));
  const recs=S.events.filter(e=>e.rec&&(e.date>=recFrom||e.id===editId)).sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start);
  if(recs.length){
    html+='<h2>📝 記録（最近2週間）</h2>';
    let lastD=null;
    recs.forEach(e=>{
      if(e.date!==lastD){lastD=e.date;const tot=recs.filter(x=>x.date===e.date).reduce((a,x)=>a+x.end-x.start,0);html+='<div class="meta" style="margin:8px 2px 2px">'+fmtDay(e.date)+'　合計 '+fmtDur(tot)+'</div>';}
      html+='<div class="card" data-ev="'+e.id+'"'+cv(e.cat)+'><div class="top"><span class="nm">📝 '+esc(e.title)+'</span><span class="meta">'+hm(e.start)+'–'+hm(e.end)+'（'+recDur(e)+'）</span></div>'
        +'<div class="meta">'+esc(e.cat)+'</div>'+(e.memo?'<div class="memo">'+esc(e.memo)+'</div>':'')+'<div class="acts"><button data-a="evedit">編集</button><button data-a="evdel">削除</button></div></div>';
    });

  if(done.length)html+='<h2>完了したもの</h2>'+done.map(card).join('');
  $('#taskView').innerHTML=html;
  $('#taskView').querySelectorAll('.card').forEach(c=>c.querySelectorAll('.acts button').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='evdel'){if(!confirm('この'+evKind(S.events.find(e=>e.id===c.dataset.ev))+'を削除しますか？'))return;S.events=S.events.filter(e=>e.id!==c.dataset.ev);replanAll();save();return renderAll();}
    if(a==='edit'||a==='evedit')return openEditor(c);
    if(a==='toev')return openEditor(c,null,{addEv:true});
    const t=S.tasks.find(x=>x.id===c.dataset.id);if(!t)return;
    const now=new Date().toISOString();
    if(a==='log'){c.classList.toggle('open');return;}
    if(a==='sub'){showView('chatView');$('#inp').value=t.title+' > ';$('#inp').focus();renderSugs();return;}
    if(a==='done')markDone(t,now);
    if(a==='alloc'){wantAlloc(t);t.log.push({t:now,x:'割り当て直し'});}
    if(a==='reopen'){reopen(t,now);childrenOf(t).forEach(k=>{if(k.done)reopen(k,now);});}
    if(a==='del'){const n=childrenOf(t).length;if(!confirm('「'+slotTitle(t)+'」を削除しますか？'+(n?'\nサブタスク'+n+'つも一緒に消えます。':'')))return;removeTask(t);}
    replanAll();save();renderAll();
    if(a==='alloc'&&!hasKids(t)&&!futureSlots(t).length)alert('割り当てられる空きがありませんでした');
  }));
  $('#taskView').querySelectorAll('.nrow [data-n]').forEach(b=>b.onclick=()=>{
    const t=S.tasks.find(x=>x.id===b.closest('.nrow').dataset.id);if(!t)return;const now=new Date().toISOString();
    if(b.dataset.n==='alloc'){wantAlloc(t);t.log.push({t:now,x:'割り当て'});}
    else markDone(t,now);
    replanAll();save();renderAll();
    if(b.dataset.n==='alloc'&&!futureSlots(t).length)alert('割り当てられる空きがありませんでした');
  });
  if(editId){const c=$('#taskView').querySelector('[data-id="'+editId+'"],[data-ev="'+editId+'"]');if(c){openEditor(c);c.scrollIntoView({block:'center'});}editId=null;}
}

function hmInputs(k,min){

function openEditor(c,onClose,opt){
  opt=opt||{};
  const id=c.dataset.id||c.dataset.ev;
  const t=S.tasks.find(x=>x.id===id), ev=t?null:S.events.find(x=>x.id===id);
  if(!t&&!ev)return;
  const it=t||ev;
  let kind=ev?(ev.rec?'rec':'ev'):'task';
  const today=dkey(new Date());
  const dl=t&&t.deadline?new Date(t.deadline):null;
  const F={
    title:it.title,cat:it.cat,memo:it.memo||'',
    noDl:t?!t.deadline:false,
    addEv:!!opt.addEv, evDate:dkey(new Date()), evStart:(()=>{const n=new Date();return hm(Math.min(1380,ceil5(n.getHours()*60+n.getMinutes())));})(),
    dDate:dl?dkey(dl):(ev?ev.date:today),
    dTime:dl&&!t.dlNoTime?pad(dl.getHours())+':'+pad(dl.getMinutes()):'',
    date:ev?ev.date:(dl?dkey(dl):today),
    start:ev?hm(ev.start):(dl&&!t.dlNoTime?pad(Math.max(0,dl.getHours()-1))+':00':'10:00'),
    end:ev?hm(ev.end):null,
    place:ev?ev.place||'':'',
    est:t?t.est:(ev.end-ev.start), done:t?!!t.done:false,
    prio:t?(t.prio||(t.parentId?'':'mid')):'mid', subs:''
  };
  if(!F.end)F.end=hm(Math.min(1435,toMin(F.start)+(F.est||60)));
  const v=k=>{const el=c.querySelector('[data-f="'+k+'"]');return !el?undefined:(el.type==='checkbox'?el.checked:el.value);};
  const hmVal=k=>Math.round((+v(k+'H')||0)*60+(+v(k+'M')||0));
  function collect(){
    ['title','cat','memo','dDate','dTime','date','start','end','place','prio','subs'].forEach(k=>{const x=v(k);if(x!==undefined)F[k]=x;});
    if(v('noDl')!==undefined)F.noDl=v('noDl');
    if(v('addEv')!==undefined)F.addEv=v('addEv');
    ['evDate','evStart','evEnd'].forEach(k=>{const x=v(k);if(x!==undefined)F[k]=x;});
    if(v('estH')!==undefined)F.est=hmVal('est');
    if(v('done')!==undefined)F.done=v('done');
  }
  function draw(){
    let f='<div class="edit">';
    f+='<label>種類</label><select data-f="kind"><option value="task"'+(kind==='task'?' selected':'')+'>📌 タスク</option><option value="ev"'+(kind==='ev'?' selected':'')+'>📅 予定（時刻が決まっている）</option><option value="rec"'+(kind==='rec'?' selected':'')+'>📝 記録（実際にやったこと）</option></select>';
    f+='<label>内容</label><input type="text" data-f="title" value="'+esc(F.title)+'">';
    f+='<label>カテゴリ</label><select data-f="cat">'+catOptions(F.cat)+'</select>';
    if(kind==='task'){
      const par=t?parentOf(t):null,kids=t?childrenOf(t):[];
      if(par)f+='<div class="meta">🧩「'+esc(par.title)+'」のサブタスク</div>';
      f+='<label>期限（時刻は空欄でもOK）</label>'
        +(F.noDl?'':'<div class="row"><input type="date" data-f="dDate" value="'+F.dDate+'"><input type="time" step="300" data-f="dTime" value="'+F.dTime+'"></div>'
          +(F.dTime?'<button class="btn" data-e="clrTime" style="margin-top:6px">時刻を外す</button>':''))
        +'<label class="ck"><input type="checkbox" data-f="noDl"'+(F.noDl?' checked':'')+'> '+(par?'期限なし（親タスクの期限に従う）':'期限なし')+'</label>'
        +'<label>優先度</label><select data-f="prio">'+(par?'<option value=""'+(F.prio===''?' selected':'')+'>親タスクと同じ（'+PRIO_JA[effPrio(par)]+'）</option>':'')
          +['high','mid','low'].map(p=>'<option value="'+p+'"'+(F.prio===p?' selected':'')+'>'+PRIO_JA[p]+'</option>').join('')+'</select>'
        +(kids.length?'<label>確保時間</label><div class="meta">サブタスクの合計 '+fmtDur(sumEst(t))+'（サブタスクごとに変えてください）</div>'
          :'<label>確保時間（カレンダーに割り当てる時間の合計）</label>'+hmInputs('est',F.est))
        +'<label class="ck"><input type="checkbox" data-f="done"'+(F.done?' checked':'')+'> 完了'+(kids.length?'（サブタスクも全部完了にする）':'')+'</label>'
        +(par?'':'<div class="subadd"><label>🧩 サブタスクを追加（1行に1つ。例：資料集め 1時間）</label>'
          +(kids.length?'<div class="meta">今あるもの：'+kids.map(k=>(k.done?'✓':'・')+esc(k.title)).join(' ')+'</div>':'')
          +'<textarea data-f="subs" rows="2" placeholder="資料集め 1時間\n構成 30分">'+esc(F.subs)+'</textarea></div>')
        +(kids.length?'':'<div class="evbox"><label class="ck"><input type="checkbox" data-f="addEv"'+(F.addEv?' checked':'')+'> 📅 予定としても入れる（タスクは残る）</label>'
        +(F.addEv?(()=>{if(!F.evEnd)F.evEnd=hm(Math.min(1435,toMin(F.evStart)+Math.max(15,F.est||30)));
            return '<label>やる日</label><input type="date" data-f="evDate" value="'+F.evDate+'">'
            +'<label>時間</label><div class="row"><input type="time" step="300" data-f="evStart" value="'+F.evStart+'"><span style="align-self:center">〜</span><input type="time" step="300" data-f="evEnd" value="'+F.evEnd+'"></div>';})():'')
        +(t&&futureSlots(t).length?'<div class="meta">割り当て：'+futureSlots(t).map(evLabel).join('、')+'</div>':'')+'</div>');
    }else{
      f+='<label>日付</label><input type="date" data-f="date" value="'+F.date+'">'
        +'<label>時間</label><div class="row"><input type="time" step="300" data-f="start" value="'+F.start+'"><span style="align-self:center">〜</span><input type="time" step="300" data-f="end" value="'+F.end+'"></div>'
        +(kind==='rec'?'':'<label>場所（移動時間を確保）</label><select data-f="place"><option value="">なし</option>'+S.places.filter(p=>p.name).map(p=>'<option'+(p.name===F.place?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>');
    }
    f+='<label>メモ</label><textarea data-f="memo" rows="3" placeholder="必要なもの、URL、注意点など">'+esc(F.memo)+'</textarea>';
    f+='<div class="acts"><button class="btn primary" data-e="save">保存</button><button class="btn" data-e="cancel">やめる</button></div></div>';
    c.innerHTML=f;
    c.querySelector('[data-f=kind]').onchange=e=>{collect();kind=e.target.value;draw();};
    c.querySelector('[data-f=noDl]')&&(c.querySelector('[data-f=noDl]').onchange=()=>{collect();draw();});
    c.querySelector('[data-f=addEv]')&&(c.querySelector('[data-f=addEv]').onchange=()=>{collect();draw();});
    const ct=c.querySelector('[data-e=clrTime]');if(ct)ct.onclick=()=>{collect();F.dTime='';draw();};
    c.querySelector('[data-e=cancel]').onclick=()=>onClose?onClose(null):renderTasks();
    c.querySelector('[data-e=save]').onclick=saveIt;
  }
  function saveIt(){
    collect();
    const title=F.title.trim();if(!title)return alert('内容を入れてください');
    const memo=F.memo.trim(),now=new Date().toISOString();
    let sum;
    if(kind==='ev'||kind==='rec'){
      const s=toMin(F.start),e=toMin(F.end);
      if(!F.date)return alert('日付を入れてください');
      if(e<=s)return alert('終わりの時刻を始まりより後にしてください');
      if(t&&hasKids(t))return alert('サブタスクがあるタスクは、予定や記録に変えられません');
      let x=ev;
      if(!x){S.tasks=S.tasks.filter(y=>y.id!==id);if(t)dropAllAuto(t);x={id};S.events.push(x);}
      const wasRec=!!x.rec;
      Object.assign(x,{title,memo,cat:F.cat,date:F.date,start:s,end:e,place:kind==='rec'?null:(F.place||null)});
      if(kind==='rec')x.rec=true;else delete x.rec;
      const changedKind=t||(wasRec!==(kind==='rec'));
      if(t)syncParent(parentOf(t));
      sum='✎ '+evKind(x)+(changedKind?'に変えました':'を更新しました')+'\n'+evIcon(x)+' '+x.title+'（'+x.cat+'）\n'+evLabel(x)+(x.rec?'（'+recDur(x)+'）':'')+(x.place?' @'+x.place:'')+movedText(replanAll());
    }else{
      if(!F.noDl&&!F.dDate)return alert('期限の日付を入れるか、「期限なし」にしてください');
      let x=t;
      if(!x){S.events=S.events.filter(y=>y.id!==id);x={id,done:false,created:now,log:[{t:now,x:evKind(ev)+'からタスクに変更'}]};S.tasks.push(x);}
      const before=x.title?x.title+' '+whenLabel(x)+' '+x.est+'分':'';
      x.title=title;x.cat=F.cat;x.memo=memo;
      if(F.noDl){x.deadline=null;x.dlNoTime=false;}
      else{
        const [y,m,d]=F.dDate.split('-').map(Number);
        const [H,M]=(F.dTime||'23:59').split(':').map(Number);
        x.deadline=new Date(y,m-1,d,H,M).toISOString();x.dlNoTime=!F.dTime;
      }
      const oldEst=t?t.est:null;
      x.prio=F.prio||null;
      if(!hasKids(x))x.est=Math.max(5,F.est||S.settings.defEst);
      if(F.done&&!x.done)markDone(x,now);
      if(!F.done&&x.done){reopen(x,now);childrenOf(x).forEach(k=>{if(k.done)reopen(k,now);});}
      if(!x.done&&!hasKids(x)&&(!t||x.est!==oldEst)){x.estGuess=false;wantAlloc(x);}
      let newEv=null;
      if(F.addEv&&!hasKids(x)){
        const s1=toMin(F.evStart),e1=toMin(F.evEnd);
        if(!F.evDate)return alert('予定の日付を入れてください');
        if(e1<=s1)return alert('予定の終わりの時刻を始まりより後にしてください');
      }
      const subLines=x.parentId?[]:String(F.subs||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      const nowD=new Date(now);
      subLines.forEach((l,i)=>{const p=parse(l,nowD);if(!p.title)return;if(!p.cat)p.cat=x.cat;
        newTaskFrom(p,x.title+' > '+l,nowD,{parentId:x.id,created:new Date(nowD.getTime()+i).toISOString(),cat:p.cat});});
      if(subLines.length){S.events=S.events.filter(e=>!(e.taskId===x.id&&e.auto));syncParent(x);}
      x.log.push({t:now,x:'編集：'+(before?before+' → ':'')+x.title+' '+whenLabel(x)+' '+x.est+'分'+(subLines.length?' ／ サブタスク追加：'+subLines.join('、'):'')});
      if(F.addEv&&!hasKids(x))newEv=addLinkedEvent(x,F.evDate,toMin(F.evStart),toMin(F.evEnd));
      const mv=replanAll(x.id);
      sum=(ev?'✎ タスクに変えました':'✎ タスクを更新しました')+'\n'+(x.parentId?'🧩 ':'📌 ')+slotTitle(x)+'（'+x.cat+'）\n'+whenLabel(x)+'\n'+prioLabel(x)+'\n'+(x.done?'完了':allocLabel(x)+'\n'+allocText(x))
        +(hasKids(x)?'\nサブタスク '+kidsDone(x)+' 完了':'')+(newEv?'\n📅 予定にも入れました：'+evLabel(newEv):'')+movedText(mv);
    }
    if(memo)sum+='\nメモ：'+memo;
    save();renderAll();renderSugs();
    if(onClose)onClose(sum);
  }
  draw();
}

function z2h(t){return t.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/：/g,':').replace(/／/g,'/').replace(/\r/g,'');}
function parseShifts(text,year,month){
  const out=[];let cur=null;
  for(let line of z2h(text).split('\n')){
    line=line.trim();if(!line)continue;
    let m=line.match(/(?:(\d{4})\s*[\/\-年]\s*)?(\d{1,2})\s*[\/月]\s*(\d{1,2})\s*日?/);
    if(m&&!/^\d{1,2}:\d{2}/.test(m[0])){
      let y=m[1]?+m[1]:year,mo=+m[2],d=+m[3];
      if(!m[1]&&mo<month-6)y++;
      cur=new Date(y,mo-1,d);
    }else if((m=line.match(/^(\d{1,2})\s*日?\s*(?:[\(（]?\s*[月火水木金土日]\s*[\)）]?)?(?=\s|$|[^\d:])/))&&!/^\d{1,2}\s*:/.test(line)){
      const d=+m[1];if(d>=1&&d<=31)cur=new Date(year,month-1,d);
    }
    const re=/(\d{1,2}):(\d{2})\s*(?:[~〜～\-－ー―]|から)\s*(\d{1,2}):(\d{2})/g;let t;
    while((t=re.exec(line))){
      if(!cur)continue;
      const s=+t[1]*60+ +t[2],e=+t[3]*60+ +t[4];
      out.push({date:dkey(cur),start:s,end:e>s?Math.min(e,1440):1440,overnight:e<=s||e>1440});
    }
  }
  const seen=new Set();return out.filter(x=>{const k=x.date+x.start+'-'+x.end;if(seen.has(k))return false;seen.add(k);return true;});
}

    if(!r){const t=S.tasks.find(t=>(t.log||[]).some(l=>l.x===c.text||l.x==='登録：'+c.text));if(t)r={k:'task',id:t.id};}
    if(!r&&next&&next.who==='app'){
      const m=next.text.match(/^(?:📌 タスクを登録しました|🗓 予定を入れました|📅 予定を入れました（時刻固定）|. (?:期限つきタスク|やる日つきタスク|タスク（日付なし）)を登録しました)\n(.+?)（/)||next.text.match(/^(?:📈|✅) (.+?)\n/)||next.text.match(/^✎ 予定「(.+?)」/)||next.text.match(/^✎ (?:名前|内容)を変えました\n.+? → (.+)$/);
      if(m)r=byTitle(m[1]);
    }
    if(r){c.ref=r;changed=true;}
  });
  if(changed)save();
}


const SYNC_KEY='cs.sync';
const SYNC_TYPES=['t','e','c'];
const KV_KEYS=['cats','catHue','catHueV2','routines','places','settings','history'];
let SY=(()=>{try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{};}catch(e){return {};}})();
SY.meta=SY.meta||{};SY.since=SY.since||0;
function saveSY(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY));}catch(e){}}
function syncCfg(){
  const s=(SY.key||'').trim();const i=s.lastIndexOf('#');
  return i>0?{url:s.slice(0,i),token:s.slice(i+1)}:null;
}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)+'.'+s.length;}
function localItems(){
  const m={};
  S.tasks.forEach(t=>m['t:'+t.id]={v:t,n:t.title});
  S.events.forEach(e=>m['e:'+e.id]={v:e,n:e.title});
  S.chat.forEach(c=>{if(c.id)m['c:'+c.id]={v:c,n:(c.who==='me'?'> ':'')+String(c.text).slice(0,40)};});
  KV_KEYS.forEach(k=>{if(S[k]!==undefined)m['k:'+k]={v:S[k],n:k};});
  return m;
}
function detectChanges(){
  const items=localItems(),now=Date.now();
  for(const k in items){
    const h=hashStr(JSON.stringify(items[k].v)),m=SY.meta[k];
    if(!m||m.h!==h||m.del)SY.meta[k]={h,u:now,dirty:1};
  }
  for(const k in SY.meta){
    const m=SY.meta[k];
    if(!items[k]&&!m.del&&SYNC_TYPES.includes(k[0]))SY.meta[k]={h:null,u:now,dirty:1,del:1};
  }
  saveSY();
}
function applyRemote(r){
  const [type,id]=[r.k.slice(0,1),r.k.slice(2)];
  if(type==='k'){if(!r.d)S[id]=r.v;return true;}
  const arr=type==='t'?S.tasks:type==='e'?S.events:type==='c'?S.chat:null;if(!arr)return false;
  const i=arr.findIndex(x=>x.id===id);
  if(r.d){if(i>=0)arr.splice(i,1);}
  else if(i>=0)arr[i]=r.v;else arr.push(r.v);
  if(type==='c')S.chat.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
  return true;
}
async function exchange(changes){
  const c=syncCfg();if(!c)throw new Error('nokey');
  const res=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({token:c.token,since:SY.since,changes,inbox:true,ack:SY.ack||[]})});
  const j=await res.json();
  if(!j.ok)throw new Error(j.err||'ng');
  let touched=false;
  const sent={};changes.forEach(x=>sent[x.k]=x.u);
  (j.applied||[]).forEach(k=>{const m=SY.meta[k];if(m&&m.u===sent[k])m.dirty=0;});
  for(const r of j.rows){
    const m=SY.meta[r.k];
    if(m&&m.dirty&&m.u>r.u)continue;
    if(m&&!m.dirty&&m.u===r.u)continue;
    if(applyRemote(r)===false)continue;touched=true;
    SY.meta[r.k]={h:r.d?null:hashStr(JSON.stringify(r.v)),u:r.u,del:r.d?1:0};
  }
  SY.since=j.now;SY.ack=[];saveSY();
  (j.inbox||[]).forEach(t=>inboxQueue.push(t));
  return touched;
}
let syncing=false,syncAgain=false,syncTimer=null,inboxQueue=[];
function syncSoon(){if(!syncCfg()||applyingRemote)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1500);}
let applyingRemote=false;
async function syncNow(manual){
  if(!syncCfg())return;
  if(syncing){syncAgain=true;return;}
  syncing=true;setSyncMsg('同期中…');
  try{
    let touched=false;
    if(!SY.since)touched=await exchange([])||touched;
    detectChanges();
    const items=localItems();
    const changes=Object.keys(SY.meta).filter(k=>SY.meta[k].dirty).map(k=>{
      const m=SY.meta[k];return m.del?{k,u:m.u,d:1}:{k,u:m.u,v:items[k].v,n:items[k].n};
    });
    touched=await exchange(changes)||touched;
    if(touched){
      applyingRemote=true;
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      applyTheme();renderCats();renderSugs();renderLog();renderAll();
      applyingRemote=false;
    }
    SY.last=Date.now();SY.err='';saveSY();
    setSyncMsg('同期しました '+fmtTime(SY.last));
  }catch(e){
    SY.err=e.message==='auth'?'合言葉が違います':e.message==='nokey'?'':'つながりませんでした（あとで自動でやり直します）';saveSY();
    setSyncMsg(SY.err);
  }finally{
    applyingRemote=false;syncing=false;
    if(inboxQueue.length){
      SY.seen=SY.seen||[];SY.ack=SY.ack||[];
      const items=inboxQueue.splice(0);let n=0;
      items.forEach(it=>{
        if(!SY.seen.includes(it.id)){
          const lines=String(it.x).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
          if(lines.length){addMsg('app','壁打ちから'+lines.length+'件届きました。順に入れます。');lines.forEach(l=>handle(l));n+=lines.length;}
          SY.seen.push(it.id);
        }
        if(!SY.ack.includes(it.id))SY.ack.push(it.id);
      });
      SY.seen=SY.seen.slice(-50);saveSY();syncSoon();
    }
    if(syncAgain){syncAgain=false;syncSoon();}
  }
}
function fmtTime(t){const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function setSyncMsg(t){const el=document.getElementById('syMsg');if(el)el.textContent=t;}
function syncBoxHTML(){
  const on=!!syncCfg();
  return '<h2>同期（PCとiPhone）</h2><div class="set shiftbox"><div class="help">同期キーを貼ると、ほかの端末とデータがそろいます。両方の端末に同じキーを入れてください。</div>'
    +'<input type="text" id="syKey" placeholder="同期キーを貼り付け" style="width:100%;margin-top:8px;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)" value="'+(on?'••••••••（設定済み）':'')+'">'
    +'<div class="acts" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn primary" id="sySave">保存して同期</button>'+(on?'<button class="btn" id="syNow">今すぐ同期</button><button class="btn" id="syOff">同期をやめる</button>':'')+'</div>'
    +'<div class="help" id="syMsg" style="margin-top:6px">'+(on?(SY.err||(SY.last?'最後の同期 '+fmtTime(SY.last):'')):'まだ設定されていません')+'</div></div>';
}
function bindSyncBox(){
  $('#syKey').onfocus=e=>{if(e.target.value.startsWith('••'))e.target.value='';};
  $('#sySave').onclick=()=>{
    const v=$('#syKey').value.trim();
    if(!v||v.startsWith('••'))return setSyncMsg('同期キーを貼り付けてください');
    if(!/^https:\/\/script\.google\.com\/.+#.+/.test(v))return setSyncMsg('同期キーの形が違います。全部コピーできているか確かめてください');
    SY={key:v,meta:{},since:0};saveSY();syncNow(true).then(()=>renderSettings());
  };
  const n=$('#syNow');if(n)n.onclick=()=>syncNow(true);
  const o=$('#syOff');if(o)o.onclick=()=>{if(!confirm('この端末の同期をやめますか？（データは消えません）'))return;SY={meta:{},since:0};saveSY();renderSettings();};
}


load();
(function(){const map={210:250,240:280,270:305,300:330,330:355,355:20,90:125,130:150,160:170,185:200};
  if(S.catHue&&!S.catHueV2){for(const k in S.catHue){if(S.catHue[k]!=null&&map[S.catHue[k]]!=null)S.catHue[k]=map[S.catHue[k]];}S.catHueV2=true;save();}})();
function applyTheme(){
  const th=(S.settings&&S.settings.theme)||'dark';
  if(th==='light')document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme;
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=th==='light'?'#f6f5f2':'#0e0f11';
}
applyTheme();
(function migrate(){
  let ch=false;
  S.chat.forEach(c=>{if(!c.id){c.id=uid();ch=true;}});
  S.tasks.forEach(t=>{
    if(t.doDate){
      if(!t.deadline){const [y,m,d]=t.doDate.split('-').map(Number);t.deadline=new Date(y,m-1,d,23,59).toISOString();t.dlNoTime=true;}
      delete t.doDate;ch=true;
    }
    if(t.deadline&&t.dlNoTime===undefined){const d=new Date(t.deadline);t.dlNoTime=d.getHours()===23&&d.getMinutes()===59;ch=true;}
  });
  if(ch)save();
})();
backfillRefs();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showView(b.dataset.v));
$('#send').onclick=()=>{const v=$('#inp').value;$('#inp').value='';handle(v);};
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#send').click();}});
$('#inp').addEventListener('input',renderSugs);
$('#inp').addEventListener('paste',e=>{
  const t=(e.clipboardData||window.clipboardData).getData('text');
  const lines=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(lines.length<2)return;
  e.preventDefault();$('#inp').value='';
  lines.forEach(l=>handle(l));
});
renderCats();renderSugs();renderLog();renderAll();tick();
setInterval(()=>{tick();if($('#dayView').classList.contains('on'))renderDay();},30000);
function receiveJobcan(){
  if(!location.hash.startsWith('#jc='))return;
  let d;try{d=JSON.parse(decodeURIComponent(location.hash.slice(4)));}catch(e){d=null;}
  history.replaceState(null,'',location.pathname+location.search);
  if(!d||!Array.isArray(d.s))return;
  shiftPreview=d.s.filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date)).map(x=>{
    const s=toMin(x.start),e0=toMin(x.end);
    return {date:x.date,start:s,end:e0>s?Math.min(e0,1440):1440,overnight:e0<=s||e0>1440,on:true};
  });
  shiftRange=d.from&&d.to?{from:d.from,to:d.to}:null;
  showView('setView');renderSettings();drawShiftPreview();
  const box=$('#shPrev');if(box)box.scrollIntoView({block:'start'});
  addMsg('app','ジョブカンから'+shiftPreview.length+'件のシフトを受け取りました。設定の取り込み画面で確認して「この内容で入れる」を押してください。');save();
}
receiveJobcan();
window.addEventListener('hashchange',receiveJobcan);
syncNow();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow();});
window.addEventListener('online',()=>syncNow());
setInterval(()=>{if(document.visibilityState==='visible')syncNow();},60000);
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
